laravel: '@testbench'

providers:
  - ExeQue\Lumberjack\LumberjackServiceProvider
  - Laravel\Horizon\HorizonServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

env:
  - APP_NAME="Lumberjack Demo"
  - APP_ENV=local
  - APP_DEBUG=true
  - APP_KEY=base64:Tlk4bnlKZkJTT3hFQW1OZmxKYXBwYXp0VlJMbHZFbmc=
  - SESSION_DRIVER=file
  - CACHE_STORE=file
  # lerd's Redis, for Horizon's reports queue; set here, as Horizon copies the
  # connection before the workbench's provider runs.
  - REDIS_HOST=lerd-redis
  - REDIS_CLIENT=phpredis

workbench:
  start: '/'
  install: false
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: false
    views: true

domains:
  - laravel-lumberjack
secured: true
services:
  - mariadb-11-8
  - mysql
  - postgres
  - redis
  - rustfs
workers:
  - agent
  - docs
  - horizon
  - queue
  - schedule
custom_workers:
  agent:
    label: Lumberjack agent
    command: php vendor/bin/testbench lumberjack:agent --name=lumberjack-agent
    restart: always
  docs:
    label: Docs
    command: env DOCS_BASE=/ npx vitepress dev . --host --port "$DOCS_PORT" --strictPort
    restart: always
    proxy:
      path: ""
      port_env_key: DOCS_PORT
      default_port: 5181
      upstream: host
      port: pinned
      subdomain: docs
    host: true
  horizon:
    label: Horizon
    command: php vendor/bin/testbench horizon
    restart: always
  queue:
    label: Queue worker
    command: php vendor/bin/testbench queue:work --tries=1 --sleep=1
    restart: always
  schedule:
    label: Scheduler
    command: php vendor/bin/testbench schedule:work
    restart: always

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# The suite reads no secret and writes nothing back.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Check code formatting
        run: composer lint:test

      - name: Static analysis
        run: composer analyse

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3, 8.4, 8.5 ]
        laravel: [ 12.*, 13.* ]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, zlib
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute tests
        run: vendor/bin/pest -p --ci

  # laravel/ai, prism-php/prism, livewire/livewire and laravel/boost are only dev dependencies: the SDK must work without them.
  tests-without-ai:
    runs-on: ubuntu-latest

    name: Without Laravel AI, Prism, Livewire and Boost

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, zlib
          coverage: none

      - name: Install dependencies
        run: |
          composer remove --dev laravel/ai prism-php/prism livewire/livewire laravel/boost --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute tests
        run: vendor/bin/pest -p --ci

  # Laravel AI 0.x reports usage differently; prefer-stable alone would only test 1.x.
  tests-laravel-ai-0:
    runs-on: ubuntu-latest

    name: Laravel AI 0.11

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, zlib
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "laravel/ai:^0.11" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute tests
        run: vendor/bin/pest -p --ci

  # Livewire 3 and 4 share the hooks the SDK listens to; prefer-stable alone would only test 4.
  tests-livewire-3:
    runs-on: ubuntu-latest

    name: Livewire 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, zlib
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "livewire/livewire:^3.6" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute tests
        run: vendor/bin/pest -p --ci

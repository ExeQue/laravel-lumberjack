name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# The suite reads no secret and writes nothing back.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Check code formatting
        run: composer lint:test

      - name: Static analysis
        run: composer analyse

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Pest 5 needs PHP 8.4; the runtime job below covers 8.3.
        php: [ 8.4, 8.5 ]
        laravel: [ 12.*, 13.* ]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, zlib
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute tests
        run: vendor/bin/pest -p --ci

  runtime:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: [ 12.*, 13.* ]

    name: PHP 8.3 runtime - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, zip, pcntl, zlib
          coverage: none

      # The dev tools need PHP 8.4; what users install must resolve on 8.3 without them.
      - name: Install without dev dependencies
        run: |
          jq 'del(."require-dev")' composer.json > composer.runtime.json && mv composer.runtime.json composer.json
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --no-dev --prefer-stable --prefer-dist --no-interaction --with-all-dependencies

      - name: Every file parses on 8.3
        run: for file in $(find src config -name '*.php'); do php -l "$file" > /dev/null; done
